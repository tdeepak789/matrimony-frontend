<div class="min-h-screen bg-[#f8fafc] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200 border border-white overflow-hidden animate-in fade-in zoom-in duration-500">
    
    <div class="bg-slate-50 p-10 text-center border-b border-slate-100">
      <div class="w-16 h-16 bg-gradient-to-br from-rose-500 to-rose-600 rounded-2xl flex items-center justify-center shadow-lg shadow-rose-200 mx-auto mb-6">
        <i class="bi bi-hearts text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-black tracking-tight text-slate-800">
        Soul<span class="text-rose-600">Connect</span>
      </h1>
      <p class="text-slate-500 font-medium mt-2 italic">Find Your Perfect Match</p>
    </div>

    <div class="p-10">
      <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-6">
        
        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Username or Email</label>
          <div class="relative group">
            <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-rose-500 transition-colors"></i>
            <input 
              type="text" 
              [(ngModel)]="username" 
              name="username" 
              placeholder="Enter your email" 
              required 
              #userField="ngModel"
              class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-rose-500 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-slate-700 font-semibold"
            />
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Password</label>
            <a href="javascript:void(0)" class="text-[10px] font-bold text-rose-600 hover:underline">Forgot?</a>
          </div>
          <div class="relative group">
            <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-rose-500 transition-colors"></i>
            <input 
              type="password" 
              [(ngModel)]="password" 
              name="password" 
              placeholder="••••••••" 
              required
              class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-rose-500 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-slate-700 font-semibold"
            />
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="loginForm.invalid || isLoading"
          class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold shadow-xl shadow-slate-200 hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-3">
          
          <ng-container *ngIf="!isLoading">
            Sign In <i class="bi bi-arrow-right-short text-xl"></i>
          </ng-container>

          <ng-container *ngIf="isLoading">
            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            Authenticating...
          </ng-container>
        </button>

        <div class="pt-6 text-center">
          <p class="text-slate-500 text-sm font-medium">
            Don't have an account? 
            <a routerLink="/user-profile" class="text-rose-600 font-bold hover:underline">Register Free</a>
          </p>
        </div>

      </form>
    </div>
  </div>
</div>
