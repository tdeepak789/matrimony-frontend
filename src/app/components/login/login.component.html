<div class="login-page">
  <div class="login-card">
    <div class="brand-logo">Matrimony<span>App</span></div>
    <h2>Find Your Perfect Match</h2>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label>Username or Email</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username" 
          placeholder="Enter your username" 
          required 
          #userField="ngModel"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••" 
          required
        />
      </div>

      <button 
        type="submit" 
        class="login-btn" 
        [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Signing in...' : 'Login' }}
      </button>

      <div class="footer-links">
        <p>Don't have an account? <a routerLink="/register">Register Free</a></p>
      </div>
    </form>
  </div>
</div>
