<div class="religious-details-container">
  <div *ngIf="!editing; else editTpl" class="animate-in fade-in duration-500">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-y-8 gap-x-12">
      
      <div class="space-y-6">
        <h4 class="text-[10px] font-black uppercase tracking-widest text-rose-500 mb-4 flex items-center gap-2">
          <i class="bi bi-person-lines-fill"></i> Cultural Identity
        </h4>
        
        <div class="detail-item">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Religion & Caste</label>
          <p class="text-slate-700 font-bold text-base">
            {{ user.religion }} • {{ user.caste }}
          </p>
        </div>

        <div class="detail-item">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Subcaste & Gothram</label>
          <p class="text-slate-700 font-bold text-base">
            {{ user.subcaste || 'Not Specified' }} 
            <span class="text-slate-300 mx-2">|</span> 
            {{ user.gothram || 'Not Specified' }}
          </p>
        </div>
      </div>

      <div class="space-y-6 p-6 bg-rose-50/50 rounded-3xl border border-rose-100/50">
        <h4 class="text-[10px] font-black uppercase tracking-widest text-rose-500 mb-4 flex items-center gap-2">
          <i class="bi bi-stars"></i> Astrological Details
        </h4>

        <div class="grid grid-cols-2 gap-4">
          <div class="detail-item">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Star (Nakshatra)</label>
            <p class="text-slate-700 font-bold text-base">{{ user.star || 'N/A' }}</p>
          </div>
          <div class="detail-item">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Moon Sign (Rasi)</label>
            <p class="text-slate-700 font-bold text-base">{{ user.rasi || 'N/A' }}</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <ng-template #editTpl>
    <form [formGroup]="form" (ngSubmit)="onSave()" class="space-y-6 animate-in slide-in-from-bottom-4 duration-300">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="form-control">
          <label class="text-xs font-bold text-slate-500 mb-2 block">Religion</label>
          <select formControlName="religion" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none">
            <option value="">Select Religion</option>
            <option *ngFor="let r of metaOptions?.religions" [value]="r">{{ r }}</option>
          </select>
        </div>

        <div class="form-control">
          <label class="text-xs font-bold text-slate-500 mb-2 block">Caste</label>
          <input formControlName="caste" placeholder="Enter Caste"
                 class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none">
        </div>

        <div class="form-control">
          <label class="text-xs font-bold text-slate-500 mb-2 block">Subcaste</label>
          <input formControlName="subcaste" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl">
        </div>

        <div class="form-control">
          <label class="text-xs font-bold text-slate-500 mb-2 block">Gothram</label>
          <input formControlName="gothram" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl">
        </div>

        <div class="form-control">
          <label class="text-xs font-bold text-slate-500 mb-2 block">Star (Nakshatra)</label>
          <select formControlName="star" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl">
            <option value="">Select Star</option>
            <option *ngFor="let s of metaOptions?.star" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="form-control">
          <label class="text-xs font-bold text-slate-500 mb-2 block">Moon Sign (Rasi)</label>
          <select formControlName="rasi" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl">
            <option value="">Select Rasi</option>
            <option *ngFor="let r of metaOptions?.rasi" [value]="r">{{ r }}</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-4 pt-6 border-t border-slate-100">
        <button type="submit" [disabled]="form.invalid" class="px-8 py-3 bg-rose-600 text-white rounded-2xl font-bold shadow-lg shadow-rose-200 hover:bg-rose-700 disabled:opacity-50 transition-all">
          Update Religious Details
        </button>
        <button type="button" (click)="onCancel()" class="px-8 py-3 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition-all">
          Cancel
        </button>
      </div>
    </form>
  </ng-template>
</div>
