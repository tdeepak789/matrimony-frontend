<div class="page-container">
  
  <header class="filters-section">
    <div class="filter-group">
      <label>Search by Name</label>
      <input type="text" [(ngModel)]="searchText" placeholder="Enter name..." />
    </div>

    <div class="filter-group">
      <label>Gender</label>
      <select [(ngModel)]="selectedGender">
        <option value="">All</option>
        <option *ngFor="let g of genders" [value]="g">{{ g }}</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Religion</label>
      <select [(ngModel)]="selectedReligion">
        <option value="">All</option>
        <option *ngFor="let r of religions" [value]="r">{{ r }}</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Caste</label>
      <input type="text" [(ngModel)]="selectedCaste" placeholder="Caste name..." />
    </div>

    <div class="filter-group">
      <label>Marital Status</label>
      <select [(ngModel)]="selectedMaritalStatus">
        <option value="">All</option>
        <option *ngFor="let m of maritalStatuses" [value]="m">{{ m }}</option>
      </select>
    </div>
  </header>

  <div class="interest-toggle" *ngIf="showInterests">
    <button (click)="setInterestView('byUser')" [class.active]="interestView === 'byUser'">
      Interested By You
    </button>
    <button (click)="setInterestView('inUser')" [class.active]="interestView === 'inUser'">
      Interested In You
    </button>
  </div>

  <div class="user-grid">
    @for (user of filteredUsers(); track user.id) {
      <div class="user-card">
        <div class="image-container">
          <img [src]="getFileUrl(user.id)" (error)="onPhotoError($event)" alt="User Photo" />
        </div>

        <div class="card-content">
          <h3 class="user-name">{{user.firstName}} {{user.lastName}}</h3>
          <div class="meta-info">
            <p><strong>Age:</strong> {{ calculateAge(user.dateOfBirth) }} years</p>
            <p><strong>Caste:</strong> {{user.caste}}</p>
            <p><strong>Job:</strong> {{user.occupation}}</p>
            <p><strong>Income:</strong> {{user.income}}</p>
          </div>
        </div>

        <div class="card-actions">
          <a [routerLink]="['/user-details', user.id]" class="btn-view">
            View Full Profile
          </a>
          
          <button 
            *ngIf="auth.isLoggedIn() && !auth.isAdmin()" 
            type="button" 
            class="btn-interest"
            [class.remove]="isUserInterested(user.id)"
            (click)="isUserInterested(user.id) ? removeUserFromInterestedProfile(user.id) : addUserToInterestedProfile(user.id)">
            {{ isUserInterested(user.id) ? 'Remove Interest' : 'Express Interest' }}
          </button>

          <button *ngIf="auth.isAdmin()" class="btn-delete" (click)="deleteUser(user.id)">
            Delete Profile
          </button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <p>No profiles found matching your search criteria.</p>
      </div>
    }
  </div>
</div>
