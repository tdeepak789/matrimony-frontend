<nav class="fixed top-0 inset-x-0 z-[100] bg-white/80 backdrop-blur-md border-b border-slate-200/60 px-6 h-20 flex items-center justify-between">
  
  <div class="flex items-center gap-2 cursor-pointer" routerLink="/user-list">
    <div class="w-10 h-10 bg-gradient-to-br from-rose-500 to-rose-600 rounded-xl flex items-center justify-center shadow-lg shadow-rose-200">
      <i class="bi bi-hearts text-white text-xl"></i>
    </div>
    <span class="text-xl font-black tracking-tighter text-slate-800">Soul<span class="text-rose-600">Connect</span></span>
  </div>

  <div class="hidden md:flex items-center gap-2">
    @if(!auth.isLoggedIn())
    {
      <ng-container>
        @if(isLoginPage())
        {
          <a routerLink="/user-profile" 
            class="px-5 py-2.5 text-sm font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition-all">
            Create Account
          </a>
        }
        @else if (isCreateUserProfilePage())
        {
          <a routerLink="/login" 
          class="px-6 py-2.5 bg-rose-600 text-white text-sm font-bold rounded-xl shadow-lg shadow-rose-100 hover:bg-rose-700 transition-all">
          Login
          </a>
        }
      </ng-container>
    }
    

    <ng-container *ngIf="auth.isLoggedIn()">
      <a routerLink="/user-list" routerLinkActive="active-nav"
         class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-600 hover:text-rose-600 transition-all rounded-xl">
        <i class="bi bi-compass"></i> Explore
      </a>
      
      <a routerLink="/user-interests" routerLinkActive="active-nav"
         class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-600 hover:text-rose-600 transition-all rounded-xl">
        <i class="bi bi-chat-heart"></i> Interests
      </a>

      <div class="w-px h-6 bg-slate-200 mx-2"></div>

      <button [matMenuTriggerFor]="profileMenu" class="flex items-center gap-3 pl-2 pr-1 py-1 rounded-2xl hover:bg-slate-50 transition-all border border-transparent hover:border-slate-100">
        <div class="w-10 h-10 rounded-xl overflow-hidden border-2 border-white shadow-sm bg-slate-100">
          <img [src]="avatarUrl" (error)="onAvatarError($event)" class="w-full h-full object-cover">
        </div>
        <i class="bi bi-chevron-down text-xs text-slate-400 mr-2"></i>
      </button>
    </ng-container>
  </div>

  <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="md:hidden text-slate-600">
    <i class="bi bi-list text-2xl"></i>
  </button>
</nav>

<mat-menu #profileMenu="matMenu" xPosition="before" class="custom-nav-menu">
  <div class="px-4 py-3 border-b border-slate-50 mb-1">
    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Account</p>
    <!-- <p class="text-sm font-bold text-slate-700 truncate">{{auth.getUserEmail() || 'User'}}</p> -->
  </div>
  <button mat-menu-item [routerLink]="['/user-details', auth.getUserId()]">
    <i class="bi bi-person-circle mr-3 text-rose-500"></i>
    <span class="font-semibold text-slate-700">My Profile</span>
  </button>
  <button mat-menu-item (click)="logout()" class="text-red-500">
    <i class="bi bi-box-arrow-right mr-3"></i>
    <span class="font-semibold">Logout</span>
  </button>
</mat-menu>

<mat-menu #mobileMenu="matMenu">
  <ng-container *ngIf="auth.isLoggedIn()">
    <button mat-menu-item routerLink="/user-list">Explore</button>
    <button mat-menu-item routerLink="/user-interests">Interests</button>
    <button mat-menu-item [routerLink]="['/user-details', auth.getUserId()]">My Profile</button>
    <button mat-menu-item (click)="logout()">Logout</button>
  </ng-container>
  <ng-container *ngIf="!auth.isLoggedIn()">
    <button mat-menu-item routerLink="/login">Login</button>
    <button mat-menu-item routerLink="/user-profile">Register</button>
  </ng-container>
</mat-menu>
